name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            cxx: cl
            configuration: Debug
          - name: Windows MSVC Release
            os: windows-latest
            cxx: cl
            configuration: Release
          - name: Linux GCC
            os: ubuntu-latest
            cxx: g++
            configuration: Debug
          - name: Linux Clang
            os: ubuntu-latest
            cxx: clang++
            configuration: Debug
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DAXISLY_BUILD_TESTS=ON -DAXISLY_BUILD_EXAMPLES=ON -DAXISLY_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.configuration }} --output-on-failure --no-tests=error
      - name: Install
        run: cmake --install build/ci --config ${{ matrix.configuration }} --prefix "${{ github.workspace }}/build/install"
      - name: Configure installed consumer
        run: cmake -S tests/consumer -B build/consumer -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install"
      - name: Build installed consumer
        run: cmake --build build/consumer --config ${{ matrix.configuration }} --parallel
      - name: Test installed consumer
        run: ctest --test-dir build/consumer -C ${{ matrix.configuration }} --output-on-failure --no-tests=error
      - name: Preserve build test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-${{ matrix.name }}
          path: |
            build/ci/Testing/Temporary/LastTest.log
            build/consumer/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitizers:
    name: Linux ${{ matrix.cxx }} ASan and UBSan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [clang++, g++]
    env:
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure instrumented core and tests
        run: cmake -S . -B build/sanitizers -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAXISLY_ENABLE_SANITIZERS=ON -DAXISLY_BUILD_TESTS=ON -DAXISLY_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build/sanitizers --parallel
      - name: Run regression and randomized cases
        run: ctest --test-dir build/sanitizers --output-on-failure --no-tests=error
      - name: Preserve sanitizer failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.cxx }}
          path: build/sanitizers/Testing/Temporary/LastTest.log

  playground:
    name: Windows SDL3 playground
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with installed monospace font
        shell: pwsh
        run: ./scripts/build-msvc.ps1 -Preset playground-release
      - name: Preserve render captures and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: axisly-playground-failure
          path: |
            build/playground-release/examples/playground/captures/
            build/playground-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  geeyoou:
    name: Windows GeeyoouUI showcase
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build host adapter and exercise all Showcase pages
        shell: pwsh
        run: ./scripts/build-msvc.ps1 -Preset geeyoou-release
      - name: Preserve host captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axisly-geeyoou-acceptance
          path: |
            build/geeyoou-release/examples/geeyoou/acceptance/
            build/geeyoou-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  reference:
    name: Taffy common-subset comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path tests/reference/taffy/Cargo.toml -- --check
      - name: Configure optional reference tooling
        run: cmake -S . -B build/reference -DCMAKE_BUILD_TYPE=Release -DAXISLY_BUILD_TESTS=ON -DAXISLY_BUILD_EXAMPLES=OFF -DAXISLY_BUILD_REFERENCE_TESTS=ON
      - name: Build reference tools
        run: cmake --build build/reference --target axisly_reference_native axisly_taffy_reference --parallel
      - name: Compare and test the harness
        run: ctest --test-dir build/reference -L reference --output-on-failure --no-tests=error
      - name: Preserve failure fixtures and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: axisly-reference-failure
          path: |
            build/reference/tests/reference/failures/
            build/reference/tests/reference/advanced-failures/
            build/reference/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
