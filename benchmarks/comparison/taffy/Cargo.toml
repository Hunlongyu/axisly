[package]
name = "axisly-taffy-bench"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
taffy = { version = "=0.14.0", default-features = false, features = ["std", "taffy_tree", "block_layout", "float_layout", "flexbox", "flexbox_balance", "grid", "calc", "content_size", "detailed_layout_info"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
