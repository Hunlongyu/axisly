[package]
name = "axisly-taffy-reference"
version = "0.0.1"
edition = "2021"
publish = false

[[bin]]
name = "axisly-taffy-reference"
path = "src/main.rs"

[[bin]]
name = "axisly-taffy-tree-reference"
path = "src/bin/tree_reference.rs"

[dependencies]
taffy = { version = "=0.14.0", default-features = false, features = ["std", "taffy_tree", "block_layout", "float_layout", "flexbox", "flexbox_balance", "grid", "calc", "content_size", "detailed_layout_info", "serde", "parse"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
