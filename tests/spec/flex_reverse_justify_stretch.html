<!doctype html>
<meta charset="utf-8">
<title>Flex row-reverse justify-content stretch fallback</title>
<style>
  body { margin: 0; }
  #flex {
    display: flex;
    flex-flow: row-reverse wrap;
    justify-content: stretch;
    width: 90px;
    height: 120px;
    gap: 4px;
  }
  #flex > div {
    flex: 0 0 auto;
    width: 40px;
    height: 20px;
  }
</style>
<div id="flex"><div></div><div></div><div></div><div></div></div>
<pre id="result"></pre>
<script>
  const flex = document.getElementById("flex");
  const origin = flex.getBoundingClientRect().left;
  const left = [...flex.children].map(child =>
    child.getBoundingClientRect().left - origin);
  document.getElementById("result").textContent =
    JSON.stringify(left) === "[50,6,50,6]" ? "PASS" : `FAIL left=${left}`;
</script>
